services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legaldb
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
