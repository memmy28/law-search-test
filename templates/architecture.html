<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Architektur – Rechts-Wissensdatenbank</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  {% include "_navbar.html" %}
  <header>
    <h1>Such-Pipeline <span class="tag">Architektur</span></h1>
    <p class="subtitle" id="diagram-subtitle">
      Hybride Suche mit Zeitfilter, RRF und Reranking — grün markiert, was im Prototyp
      bereits umgesetzt ist, gelb teilweise, rot noch offen.
    </p>
  </header>

  <main class="architecture-main">
    <div class="version-toggle">
      <button type="button" class="version-btn active" data-version="1">Version 1</button>
      <button type="button" class="version-btn" data-version="2">Version 2</button>
    </div>

    <section class="panel diagram-panel">
      <img src="/architektur/diagram.svg?v=1" alt="Such-Pipeline Diagramm" class="diagram" id="diagram-img" />
    </section>
  </main>

  <script>
    const SUBTITLES = {
      "1": "Hybride Suche mit Zeitfilter, RRF und Reranking — grün markiert, was im Prototyp bereits umgesetzt ist, gelb teilweise, rot noch offen.",
      "2": "Ursprüngliche Fassung des Diagramms ohne Umsetzungsstatus-Markierung — zum Vergleich mit der aktuellen Version."
    };

    document.querySelectorAll(".version-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const version = btn.dataset.version;
        document.querySelectorAll(".version-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("diagram-img").src = `/architektur/diagram.svg?v=${version}`;
        document.getElementById("diagram-subtitle").textContent = SUBTITLES[version];
      });
    });
  </script>
</body>
</html>
